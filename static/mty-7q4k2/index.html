<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f766e">
<title>Monterrey · Private</title>
<style>
  :root { --bg:#fff8ef; --card:#fff; --ink:#23313a; --muted:#7b8b96; --line:#ecdfd2; --accent:#0f766e; --shadow:0 3px 0 rgba(35,49,58,.10); }
  @media (prefers-color-scheme: dark) { :root { --bg:#121820; --card:#1a232e; --ink:#f0ece6; --muted:#93a3ae; --line:#2a3641; --accent:#5eead4; --shadow:0 3px 0 rgba(0,0,0,.35); } }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px;
    background:var(--bg); color:var(--ink); font-family:ui-rounded,-apple-system,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;
    background-image:radial-gradient(circle at 12% 0%,rgba(255,196,120,.18),transparent 42%),radial-gradient(circle at 92% 8%,rgba(94,234,212,.14),transparent 40%);
  }
  .card { width:100%; max-width:420px; background:var(--card); border:2px solid var(--line); border-radius:24px; box-shadow:var(--shadow); padding:28px 22px; text-align:center; animation:pop .3s ease both; }
  @keyframes pop { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:none; } }
  .em { font-size:52px; line-height:1; }
  h1 { font-size:24px; letter-spacing:-.02em; margin:10px 0 2px; }
  .sub { font-size:12.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  p { font-size:14px; color:var(--muted); font-weight:600; margin:12px 0 18px; line-height:1.45; }
  form { display:grid; gap:10px; }
  input { width:100%; font:inherit; font-size:16px; font-weight:700; padding:13px 14px; border-radius:14px; border:2px solid var(--line); background:var(--bg); color:var(--ink); outline:none; text-align:center; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent); }
  button { font:inherit; font-size:15px; font-weight:900; padding:13px; border:0; border-radius:14px; background:var(--accent); color:#fff; box-shadow:var(--shadow); cursor:pointer; }
  button:disabled { opacity:.6; }
  @media (prefers-color-scheme: dark) { button { color:#08201d; } }
  #msg { min-height:18px; font-size:12.5px; font-weight:800; color:#b23b3b; margin:8px 0 0; }
  .foot { font-size:11px; color:var(--muted); font-weight:700; margin-top:16px; }
  body.shake .card { animation:shake .35s; }
  @keyframes shake { 0%,100% { transform:none; } 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
</style>
</head>

  </form>

      b = document.getElementById("b"), msg = document.getElementById("msg");
  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pass = p.value.trim();
    if (!pass) { msg.textContent = "Enter the passphrase."; return; }
    if (!window.crypto || !window.crypto.subtle) {
      msg.textContent = "Open this page over https."; return;
    }
    msg.textContent = ""; b.disabled = true; b.textContent = "Unlocking…";
    var enc = new TextEncoder();
    crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
    }).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(CT));
    }).then(function (buf) {
      var html = new TextDecoder().decode(buf);
      try { sessionStorage.setItem(CACHE, html); } catch (e) {}
      render(html);
    }).catch(function () {
      b.disabled = false; b.textContent = "Unlock";
      msg.textContent = "Wrong passphrase — try again.";
      document.body.classList.remove("shake");
      void document.body.offsetWidth;
      document.body.classList.add("shake");
      p.select();
    });
  });
})();
</script>
</body>
</html>
